server {
    listen 80;

    # BUGFIX: nginx default header buffers are 1k/8k which the browser
    # blew past once it accumulated cookies for localhost (from this app +
    # any other dev project sharing the host). That caused
    # "400 Request Header Or Cookie Too Large" before the SPA could ever
    # render. Bumping the buffers fixes it without changing any app code.
    large_client_header_buffers 8 32k;
    client_header_buffer_size   32k;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}
